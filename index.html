<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark" style="font-size:12px">TZ</div><div><div class="brand-name">TZ Solutions</div><div class="brand-sub">INVENTORY CONTROL</div></div></div>

    <div class="side-bottom"><div class="nav-label" id="adminLabel">Administration</div><nav class="nav-list" id="adminNav"></nav><div class="profile"><div class="avatar" id="currentAvatar">AM</div><div><div class="profile-name" id="currentName">Signed out</div><div class="profile-role" id="currentRole">Sign in required</div></div><button class="side-logout" id="logoutButton" type="button">Sign out</button></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center"><button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button><div class="crumb"><span>Workspace</span> &nbsp;/&nbsp; <b id="crumbName">Overview</b></div></div><div class="top-actions"><span class="date-label" id="todayDate"></span><button class="icon-button" id="alertsButton" aria-label="View notifications">♧<span class="notify-dot"></span></button><button class="primary-button" id="quickAction">＋ <span id="quickActionLabel">New transaction</span></button><button class="secondary-button" id="headerSignOut" type="button">Sign out</button></div></header>
    <section class="page" id="page" aria-live="polite"></section>
  </main>
</div>
<div id="overlay"></div><div id="authScreen"></div><div id="toastRoot" aria-live="polite"></div>
<script>
(() => {
  const seedProducts = [];
  const seedTransactions = [];
  const seedVendors = [];
  let workspaceId='legacy';
  let localEditRevision=0;
  const storageKey=key=>`ledgerlot-${workspaceId==='legacy'?'':`${workspaceId}-`}${key}`;
  const load = (key, fallback) => { try { const value=localStorage.getItem(storageKey(key)); return value ? JSON.parse(value) : fallback; } catch { return fallback; } };
  let products=load('products',seedProducts), transactions=load('transactions',seedTransactions), audit=load('audit',[]), vendors=load('vendors',seedVendors), bills=load('bills',[]);
  let active='Overview', filter='All', search='', toastTimer, inventorySyncTimer, gmailConfigured=false, currentUser=null, availableRoles=[], organizations=[], organizationUsers=[], organizationUsersLoaded=false, organizationUsersLoading=false, remoteWorkspaceLoaded=false, preferredOrganizationId='', preferredEmail='', serverAuthEvents=[], authAuditLoaded=false, authAuditLoading=false, ownerSignature=load('owner-signature',''), ownerSignatureDate=load('owner-signature-date',''), dayEndReports=load('day-end-reports',[]), dayEndRunning=false;
  const navItems=[['Overview','⌂'],['Products','▦'],['Stock In','↓'],['Stock Out','↑'],['Sales','↗'],['Refunds','↩'],['Vendors','◇'],['Vendor Bills','▧'],['Day-End','≡'],['Reports','▤']];
  const adminItems=[['Users & Roles','♙'],['Notifications','◎'],['Audit Log','◷']];
  const roleAccess={
    Administrator:new Set([...navItems.map(([name])=>name),...adminItems.map(([name])=>name)]),
    Manager:new Set([...navItems.map(([name])=>name),'Notifications','Audit Log']),
    Staff:new Set(['Overview','Products','Stock In','Stock Out','Sales'])
  };
  const $=id=>document.getElementById(id), money=value=>'$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const saveWorkspaceLocally=()=>{localStorage.setItem(storageKey('products'),JSON.stringify(products));localStorage.setItem(storageKey('transactions'),JSON.stringify(transactions));localStorage.setItem(storageKey('audit'),JSON.stringify(audit));localStorage.setItem(storageKey('vendors'),JSON.stringify(vendors));localStorage.setItem(storageKey('bills'),JSON.stringify(bills));};
  const save=()=>{localEditRevision++;saveWorkspaceLocally();queueInventorySync();};
  const localDayKey=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  function transactionsForDay(day){
    const target=new Date(`${day}T00:00:00`);
    return transactions.filter(transaction=>{
      if(transaction.day)return transaction.day===day;
      const value=String(transaction.date||'').trim();
      if(value.startsWith('Today'))return day===localDayKey();
      if(/^\d{4}-\d{2}-\d{2}/.test(value))return value.slice(0,10)===day;
      return false;
    });
  }
  function createDayEndReports(day){
    const dailyTransactions=transactionsForDay(day);
    const sales=dailyTransactions.filter(transaction=>transaction.type==='Sale');
    const refunds=dailyTransactions.filter(transaction=>transaction.type==='Refund');
    const dailyBills=bills.filter(bill=>bill.billDate===day||bill.paidDate===day);
    const rowsForTransactions=list=>[['ID','Type','Product','SKU','Quantity','Amount','Date','User','Reference'],...list.map(transaction=>[transaction.id,transaction.type,transaction.product,transaction.sku,transaction.quantity,transaction.amount,transaction.date,transaction.user,transaction.reference])];
    return {date:day,reports:[
      {type:'stock',title:'Day-wise Stock Report',filename:`${day}-day-wise-stock-report.pdf`,rows:[['SKU','Product','Category','Vendor','On hand','Reorder point','Unit cost','Stock value'],...products.map(product=>[product.id,product.name,product.category,product.vendor,product.stock,product.reorder,product.cost,product.stock*product.cost])]},
      {type:'sales',title:'Day-wise Sells Report',filename:`${day}-day-wise-sells-report.pdf`,rows:rowsForTransactions(sales)},
      {type:'transactions',title:'Day-wise Transaction Report',filename:`${day}-day-wise-transaction-report.pdf`,rows:rowsForTransactions(dailyTransactions)},
      {type:'accounting',title:"Day's Basic Accounting Report",filename:`${day}-days-basic-accounting-report.pdf`,rows:[['Account','Amount'],['Gross sales',sales.reduce((sum,transaction)=>sum+Number(transaction.amount||0),0)],['Refunds',refunds.reduce((sum,transaction)=>sum+Number(transaction.amount||0),0)],['Net sales',sales.reduce((sum,transaction)=>sum+Number(transaction.amount||0),0)-refunds.reduce((sum,transaction)=>sum+Number(transaction.amount||0),0)],['Sales transactions',sales.length],['Refund transactions',refunds.length],['Stock received (units)',dailyTransactions.filter(transaction=>transaction.type==='Stock In').reduce((sum,transaction)=>sum+Number(transaction.quantity||0),0)],['Stock adjusted out (units)',dailyTransactions.filter(transaction=>transaction.type==='Stock Out').reduce((sum,transaction)=>sum+Number(transaction.quantity||0),0)],['Inventory value',products.reduce((sum,product)=>sum+Number(product.stock||0)*Number(product.cost||0),0)],['Open vendor bills',dailyBills.filter(bill=>bill.status!=='Paid').reduce((sum,bill)=>sum+Number(bill.amount||0),0)],['Paid vendor bills',dailyBills.filter(bill=>bill.status==='Paid').reduce((sum,bill)=>sum+Number(bill.amount||0),0)]]}
    ]};
  }
  function downloadDayEndReport(report){
    const pageWidth=842,pageHeight=595,margin=36,tableWidth=pageWidth-margin*2;
    const ascii=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?');
    const escapePdf=value=>ascii(value).replace(/([\\()])/g,'\\$1');
    const commands=[],pages=[];
    let page=[],cursorY=0;
    const text=(x,top,value,size=8,color='0.16 0.22 0.18')=>page.push(`BT /F1 ${size} Tf ${color} rg 1 0 0 1 ${x.toFixed(2)} ${(pageHeight-top-size).toFixed(2)} Tm (${escapePdf(value)}) Tj ET`);

    const addFooter=()=>{line(margin,pageHeight-27,pageWidth-margin,pageHeight-27);text(margin,pageHeight-22,'TZ Solutions - Inventory Control',7,'0.42 0.47 0.43');text(pageWidth-margin-90,pageHeight-22,'Page __PAGE__ of __TOTAL__',7,'0.42 0.47 0.43');};

    const columnCount=Math.max(headers.length,1),columnWidth=tableWidth/columnCount,fontSize=columnCount>7?6.5:7.5,padding=5;
    const wrap=(value,maxChars)=>{
      const words=ascii(value).split(/\s+/);
      const lines=[];
      let current='';
      for(const word of words){
        if(word.length>maxChars){
          if(current){lines.push(current);current='';}
          for(let index=0;index<word.length;index+=maxChars)lines.push(word.slice(index,index+maxChars));
        }else if(!current)current=word;
        else if((current+' '+word).length<=maxChars)current+=' '+word;

      }

      line(margin,cursorY+rowHeight,margin+tableWidth,cursorY+rowHeight);

    });

    pages.push(page.join('\n'));
    const objects=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
    const pageIds=[];
    pages.forEach((content,index)=>{
      const pageId=4+index*2,contentId=pageId+1;
      pageIds.push(`${pageId} 0 R`);
      const stream=content.replace('__PAGE__',String(index+1)).replace('__TOTAL__',String(pages.length));
      objects[pageId]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;

    const xrefOffset=pdf.length;

    for(let index=1;index<objects.length;index++)pdf+=`${String(offsets[index]).padStart(10,'0')} 00000 n \n`;
    pdf+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
    const link=document.createElement('a');
    link.href=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));

  async function executeDayEnd(){
    const day=localDayKey();
    if(dayEndRunning)return;
    if(dayEndReports.some(record=>record.date===day)){
      showToast('Day-end accounting has already been completed today.');
      return;
    }
    dayEndRunning=true;
    const button=$('page').querySelector('[data-action="close-day"]');
    if(button){button.disabled=true;button.textContent='Generating reports…';}
    try{
      const snapshot=createDayEndReports(day);
      let record={...snapshot,generatedAt:new Date().toISOString(),generatedBy:currentUser?.name||'Local user'};
      if(location.protocol!=='file:'){
        const response=await fetch('/api/day-end',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot)});
        const result=await response.json();
        if(response.status===409){
          if(result.report&&!dayEndReports.some(item=>item.date===result.report.date))dayEndReports.push(result.report);
          localStorage.setItem(storageKey('day-end-reports'),JSON.stringify(dayEndReports));
          showToast('Day-end accounting has already been completed today.');
          render();
          return;
        }
        if(!response.ok)throw new Error(result.error||'Could not generate day-end reports.');
        record=result.report;
      }
      dayEndReports=[...dayEndReports.filter(item=>item.date!==day),record];
      localStorage.setItem(storageKey('day-end-reports'),JSON.stringify(dayEndReports));
      logAudit('Day-end closed',`Daily reports generated for ${day}`);
      showToast('Day-end accounting completed. Four reports are ready to download.');
      render();
    }catch(error){
      showToast(error.message||'Could not generate day-end reports.');
      if(button){button.disabled=false;button.textContent='Close today';}
    }finally{dayEndRunning=false;}
  }

  function logAudit(action,detail,user=currentUser?.name||'System'){
    const time='Today, '+new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
    const transactionType={'Stock received':'Stock In','Inventory adjusted':'Stock Out','Sale recorded':'Sale','Refund approved':'Refund'}[action];
    if(transactionType&&transactions[0]?.type===transactionType){transactions[0].user=user;transactions[0].day||=localDayKey();}
    audit.unshift({action,detail,user,time});
    if(['Stock received','Inventory adjusted','Sale recorded','Refund approved','Product created'].includes(action)){
      const movedProduct=products.find(product=>detail.includes(product.name));
      if(movedProduct){
        if(movedProduct.stock<=movedProduct.reorder&&!movedProduct.alerted){
          movedProduct.alerted=true;
          audit.unshift({action:'Low-stock alert queued',detail:`${movedProduct.name} → ${movedProduct.vendor}`,user:'System',time});
        }else if(movedProduct.stock>movedProduct.reorder){
          movedProduct.alerted=false;
        }
      }
    }
    audit=audit.slice(0,50);
    save();
  }
  function productStatus(product){return product.stock<=product.reorder?'Low stock':product.stock<=product.reorder*1.5?'Watch':'In stock';}
  function daysUntilExpiry(expiryDate){if(!expiryDate)return Infinity;const expiry=new Date(`${expiryDate}T00:00:00`),today=new Date();if(Number.isNaN(expiry.getTime()))return Infinity;expiry.setHours(0,0,0,0);today.setHours(0,0,0,0);return Math.round((expiry-today)/86400000);}
  function expiryStatus(product){if(!product.expiryDate)return 'Not set';const days=daysUntilExpiry(product.expiryDate);return days<0?'Expired':days<=15?'Expiring soon':'Valid';}
  function refreshExpiryAlerts(){
    let changed=false;
    products.forEach(product=>{
      if(!product.expiryDate||product.stock<=0){if(product.expiryAlertKey){product.expiryAlertKey='';changed=true;}return;}
      const days=daysUntilExpiry(product.expiryDate);
      if(days>15){if(product.expiryAlertKey){product.expiryAlertKey='';changed=true;}return;}
      const state=days<0?'expired':'upcoming',key=`${product.expiryDate}:${state}`;
      if(product.expiryAlertKey!==key){
        product.expiryAlertKey=key;
        changed=true;
        logAudit(state==='expired'?'Product expired':'Product expiring within 15 days',`${product.name} · ${product.expiryDate} · ${product.vendor}`,'System');
      }
    });
    if(changed)save();
    return changed;
  }

  function chart(){
    const canvas=$('salesChart');
    if(!canvas)return;
    const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;
    canvas.width=rect.width*ratio;
    canvas.height=rect.height*ratio;
    const ctx=canvas.getContext('2d');
    ctx.scale(ratio,ratio);
    const width=rect.width,height=rect.height,padding={left:39,right:9,top:15,bottom:25};
    const period=$('chartPeriod')?.value;
    const pointCount=period==='30 days'?30:7;
    const today=new Date();
    today.setHours(0,0,0,0);
    const dayMs=24*60*60*1000;
    const sales=transactions.filter(transaction=>transaction.type==='Sale');
    const users=[...new Set(sales.map(transaction=>transaction.user||'Unknown'))];
    const byUser=new Map(users.map(user=>[user,Array(pointCount).fill(0)]));
    sales.forEach(transaction=>{
      const dateText=String(transaction.date||'');
      let daysAgo;
      if(dateText.startsWith('Today'))daysAgo=0;
      else if(dateText.startsWith('Yesterday'))daysAgo=1;
      else{
        const parsed=new Date(`${dateText}, ${new Date().getFullYear()}`);
        parsed.setHours(0,0,0,0);
        daysAgo=Math.round((today-parsed)/dayMs);
      }
      const index=pointCount-1-daysAgo;
      if(Number.isFinite(index)&&index>=0&&index<pointCount)byUser.get(transaction.user||'Unknown')[index]+=Number(transaction.amount)||0;
    });
    const total=Array(pointCount).fill(0);
    byUser.forEach(values=>values.forEach((value,index)=>total[index]+=value));
    const colors=['#bf5944','#456f8b','#ad7f2d','#647554','#8a6380','#4e8a80'];
    const series=[{name:'All sales',values:total,color:'#1e674d',total:true},...users.map((user,index)=>({name:user,values:byUser.get(user),color:colors[index%colors.length]}))];
    const maxValue=Math.max(1,...total);
    const max=Math.ceil(maxValue/4)*4;
    const x=index=>padding.left+index*(width-padding.left-padding.right)/(pointCount-1);
    const y=value=>padding.top+(max-value)*(height-padding.top-padding.bottom)/max;
    ctx.font='9px IBM Plex Mono, monospace';
    ctx.fillStyle='#89918a';
    ctx.strokeStyle='#edf0eb';
    ctx.lineWidth=1;
    for(let tick=0;tick<=4;tick++){

    }
    const gradient=ctx.createLinearGradient(0,padding.top,0,height-padding.bottom);
    gradient.addColorStop(0,'#1e674d33');
    gradient.addColorStop(1,'#1e674d00');
    ctx.beginPath();
    total.forEach((value,index)=>index?ctx.lineTo(x(index),y(value)):ctx.moveTo(x(index),y(value)));
    ctx.lineTo(x(pointCount-1),height-padding.bottom);ctx.lineTo(x(0),height-padding.bottom);ctx.closePath();
    ctx.fillStyle=gradient;ctx.fill();
    series.forEach(line=>{
      ctx.beginPath();
      line.values.forEach((value,index)=>index?ctx.lineTo(x(index),y(value)):ctx.moveTo(x(index),y(value)));
      ctx.strokeStyle=line.color;ctx.lineWidth=line.total?2.5:1.8;ctx.stroke();

    });
    const labelIndexes=pointCount===7?[0,1,2,3,4,5,6]:[0,5,10,15,20,25,29];

      const date=new Date(today);date.setDate(today.getDate()-(pointCount-1-index));

    const canvas=$('signatureCanvas');

    let drawing=false,hasInk=false;

    context.lineWidth=3;

    canvas.addEventListener('pointermove',event=>{if(!drawing)return;const position=point(event);context.lineTo(position.x,position.y);context.stroke();hasInk=true;$('signatureSave').disabled=false;});
    canvas.addEventListener('pointerup',()=>drawing=false);

    const printWindow=window.open('','_blank');
    if(!printWindow){showToast('Allow pop-ups to generate the bill copy.');return;}
    const documentHtml=`<!doctype html><html><head><meta charset="utf-8"><title>Vendor Bill ${escapeHtml(bill.invoice)}</title><style>body{font:14px Arial,sans-serif;color:#19251f;margin:42px}header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1e674d;padding-bottom:18px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:28px 0 8px}.muted{color:#66716a;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dfe4dd;font-size:12px}th{background:#f2f4ef}.total{text-align:right;font-size:18px;font-weight:bold;margin:20px 0}.signature{margin-top:42px;width:220px;height:85px;object-fit:contain;object-position:left bottom;border-bottom:1px solid #59645c}.sign-name{font-weight:bold;margin-top:8px}.sign-date{font-size:11px;color:#66716a;margin-top:3px}@media print{body{margin:15mm}button{display:none}}</style></head><body><header><div><h1>TZ Solutions</h1><div class="muted">Vendor bill copy</div></div><div class="muted">Bill ID: ${escapeHtml(bill.id)}</div></header><h2>${escapeHtml(bill.vendor)}</h2><div class="muted">${escapeHtml(vendor?.email||'')}</div><div class="meta"><div><b>Invoice:</b> ${escapeHtml(bill.invoice)}</div><div><b>PO reference:</b> ${escapeHtml(bill.po||'—')}</div><div><b>Invoice date:</b> ${escapeHtml(bill.billDate)}</div><div><b>Due date:</b> ${escapeHtml(bill.dueDate)}</div><div><b>Payment status:</b> ${escapeHtml(bill.status)}</div></div><table><thead><tr><th>Description</th><th>SKU</th><th>Qty</th><th>Unit cost</th><th>Line total</th></tr></thead><tbody>${rows||`<tr><td colspan="5">Stock receipt</td></tr>`}</tbody></table><div class="total">Bill total: ${money(bill.amount)}</div><div><img class="signature" src="${escapeHtml(ownerSignature)}" alt="Owner signature"><div class="sign-name">Alex Morgan · Owner, TZ Solutions</div><div class="sign-date">Digitally signed on ${escapeHtml(signatureDate)}</div></div></body></html>`;
    printWindow.document.open();
    printWindow.document.write(documentHtml);
    printWindow.document.close();
    logAudit('Signed vendor bill copy generated',`${bill.invoice} · ${bill.vendor}`);
    setTimeout(()=>{printWindow.focus();printWindow.print();},250);
  }
  function showEmailChoices(){
    const choices=vendors.map(vendor=>({vendor,items:products.filter(product=>product.vendor===vendor.name&&(product.stock<=product.reorder||isExpiryAlert(product)))})).filter(choice=>choice.items.length);
    if(!choices.length){showToast('No stock or expiry alerts need a vendor notice.');return;}
    $('overlay').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="emailModalTitle"><div class="modal-head"><div><h2 id="emailModalTitle">Email low-stock vendors</h2><div class="modal-subtitle">Choose a supplier to open a prefilled draft in your mail app.</div></div><button type="button" class="close-button" id="closeModal" aria-label="Close">×</button></div><div class="settings-panel">${choices.map(({vendor,items})=>`<div class="setting-row"><span><b>${escapeHtml(vendor.name)}</b><br><small style="color:var(--muted)">${items.length} low-stock ${items.length===1?'item':'items'} · ${escapeHtml(vendor.email)}</small></span><button class="small-button" data-compose-vendor="${escapeHtml(vendor.name)}">Compose email ↗</button></div>`).join('')}</div><div class="modal-actions"><button type="button" class="secondary-button" id="cancelModal">Cancel</button></div></section></div>`;
    $('emailModalTitle').textContent='Email vendors with inventory alerts';
    $('emailModalTitle').nextElementSibling.textContent='Choose a supplier to draft low-stock and expiry alerts in your mail app.';
    document.querySelectorAll('#overlay .setting-row small').forEach((label,index)=>label.textContent=`${choices[index].items.length} inventory alerts · ${choices[index].vendor.email}`);
    $('closeModal').addEventListener('click',closeModal);
    $('cancelModal').addEventListener('click',closeModal);
    $('modalBackdrop').addEventListener('click',event=>{if(event.target.id==='modalBackdrop')closeModal();});
    document.querySelectorAll('[data-compose-vendor]').forEach(button=>button.addEventListener('click',()=>notifyVendor(button.dataset.composeVendor)));
  }
  function notifyVendor(name){
    const vendor=vendors.find(item=>item.name===name);
    if(!vendor||!vendor.email){showToast('Add an email address for this vendor first.');return;}
    const affected=products.filter(product=>product.vendor===name&&(product.stock<=product.reorder||isExpiryAlert(product)));
    if(!affected.length){showToast('No stock or expiry alerts need a vendor notice.');return;}
    const subject=`Inventory alert: ${affected.length} ${affected.length===1?'item':'items'} need attention`;
    const itemLines=affected.map(product=>{
      const details=[];
      if(product.stock<=product.reorder)details.push(`${product.stock} on hand; reorder point ${product.reorder}; suggested order ${Math.max(product.reorder*2-product.stock,product.reorder)} units`);
      if(isExpiryAlert(product)){const days=daysUntilExpiry(product.expiryDate);details.push(days<0?`expired on ${product.expiryDate}`:`expires on ${product.expiryDate} in ${days} days`);}
      return `- ${product.name} (${product.id}): ${details.join('; ')}`;
    });
    const body=`Hello ${vendor.contact},\n\nPlease review these inventory alerts:\n\n${itemLines.join('\n')}\n\nPlease confirm the appropriate action and expected delivery.\n\nRegards,\nTZ Solutions`;
    const address=encodeURIComponent(vendor.email).replace(/%40/gi,'@');
    const mailto=`mailto:${address}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    logAudit('Vendor inventory alert email drafted',`${name} · ${affected.length} ${affected.length===1?'item':'items'}`);
    const link=document.createElement('a');
    link.href=mailto;
    document.body.appendChild(link);
    link.click();
    link.remove();
    closeModal();
    showToast(`Email draft opened for ${name}. Review and send it from your mail app.`);
  }
  function exportData(kind){let rows=[],filename='';if(kind==='0'){rows=[['SKU','Product','Category','Vendor','On hand','Reorder point','Unit cost','Sale price'],...products.map(p=>[p.id,p.name,p.category,p.vendor,p.stock,p.reorder,p.cost,p.price])];filename='inventory.csv';}else if(kind==='1'){rows=[['ID','Type','Product','SKU','Quantity','Amount','Date','User','Reference'],...transactions.map(t=>[t.id,t.type,t.product,t.sku,t.quantity,t.amount,t.date,t.user,t.reference])];filename='transactions.csv';}else if(kind==='2'){rows=[['ID','Type','Product','SKU','Quantity','Date','Reference'],...transactions.map(t=>[t.id,t.type,t.product,t.sku,t.quantity,t.date,t.reference])];filename='stock-movement.csv';}else{rows=[['Activity','Details','User','Timestamp'],...audit.map(a=>[a.action,a.detail,a.user,a.time])];filename='audit-log.csv';}const csv=rows.map(row=>row.map(value=>'"'+String(value??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download=filename;link.click();URL.revokeObjectURL(link.href);showToast(`${filename} exported.`);logAudit('Report exported',filename);}
  function showToast(message){clearTimeout(toastTimer);$('toastRoot').innerHTML=`<div class="toast">${escapeHtml(message)}</div>`;toastTimer=setTimeout(()=>$('toastRoot').innerHTML='',3200);}
  function renderLogin(message=''){
    currentUser=null;
    document.body.classList.add('signed-out');
    setNav();
    const selectedOrganization=preferredOrganizationId||organizations[0]?.id||'';
    const organizationOptions=organizations.map(organization=>`<option value="${escapeHtml(organization.id)}" ${organization.id===selectedOrganization?'selected':''}>${escapeHtml(organization.name)}</option>`).join('')||'<option value="">No organizations yet</option>';
    const selected=organizations.find(organization=>organization.id===selectedOrganization);
    availableRoles=selected?.roles||[];
    const roleOptions=availableRoles.map(role=>`<option value="${escapeHtml(role)}">${escapeHtml(role)}</option>`).join('')||'<option value="">No user roles</option>';
    const help=location.protocol==='file:'?'Open the application at http://127.0.0.1:3000 to sign in.':organizations.length?'Choose your organization, then sign in with your assigned account.':'Create an organization to set up your inventory workspace.';
    $('authScreen').innerHTML=`<div class="auth-screen"><section class="auth-panel"><div class="brand"><div class="brand-mark" style="font-size:12px">TZ</div><div><div class="brand-name">TZ Solutions</div><div class="brand-sub">INVENTORY CONTROL</div></div></div><h1 class="auth-title" id="authTitle">Sign in</h1><p class="auth-copy">Choose your organization to access its inventory workspace.</p><form class="auth-form" id="loginForm"><div class="field"><label for="loginOrganization">Organization</label><select id="loginOrganization" required>${organizationOptions}</select></div><div class="field"><label for="loginRole">Role</label><select id="loginRole" required>${roleOptions}</select></div><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" value="${escapeHtml(preferredEmail)}" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div class="auth-error" id="authError" role="alert">${escapeHtml(message)}</div><button class="primary-button" type="submit" ${availableRoles.length?'':'disabled'}>Sign in</button></form><button class="secondary-button" id="showSignup" type="button" ${location.protocol==='file:'?'disabled':''} style="width:100%;margin-top:10px">Create an organization</button><p class="auth-help">${escapeHtml(help)}</p></section></div>`;
    const loginPanel=$('authScreen').querySelector('.auth-panel');
    loginPanel.setAttribute('role','dialog');
    loginPanel.setAttribute('aria-modal','true');
    loginPanel.setAttribute('aria-labelledby','authTitle');
    $('loginOrganization').addEventListener('change',()=>{
      preferredOrganizationId=$('loginOrganization').value;
      const organization=organizations.find(item=>item.id===preferredOrganizationId);
      availableRoles=organization?.roles||[];
      $('loginRole').innerHTML=availableRoles.map(role=>`<option value="${escapeHtml(role)}">${escapeHtml(role)}</option>`).join('')||'<option value="">No user roles</option>';
      $('loginForm').querySelector('[type="submit"]').disabled=!availableRoles.length;
    });
    $('showSignup').addEventListener('click',()=>renderOrganizationSignup());
    const form=$('loginForm');
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const submit=form.querySelector('[type="submit"]');
      submit.disabled=true;
      $('authError').textContent='';
      try{
        const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organizationId:$('loginOrganization').value,role:$('loginRole').value,email:$('loginEmail').value,password:$('loginPassword').value})});
        const result=await response.json();
        if(!response.ok){$('authError').textContent=result.error||'Sign-in failed.';submit.disabled=false;return;}
        preferredOrganizationId=result.user.organizationId;
        preferredEmail=result.user.email;
        enterApplication(result.user);
      }catch{$('authError').textContent='Could not reach the sign-in service.';submit.disabled=false;}
    });
  }
  function renderOrganizationSignup(message=''){
    $('authScreen').innerHTML=`<div class="auth-screen"><section class="auth-panel"><div class="brand"><div class="brand-mark" style="font-size:12px">TZ</div><div><div class="brand-name">TZ Solutions</div><div class="brand-sub">INVENTORY CONTROL</div></div></div><h1 class="auth-title" id="authTitle">Create your organization</h1><p class="auth-copy">Set up a private inventory workspace and its first Administrator account.</p><form class="auth-form" id="signupForm"><div class="field"><label for="signupOrganization">Organization name</label><input id="signupOrganization" minlength="2" maxlength="80" autocomplete="organization" required></div><div class="field"><label for="signupName">Administrator name</label><input id="signupName" minlength="2" maxlength="80" autocomplete="name" required></div><div class="field"><label for="signupEmail">Administrator email</label><input id="signupEmail" type="email" maxlength="254" autocomplete="email" required></div><div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><small class="auth-help">Use at least 12 characters.</small></div><div class="auth-error" id="authError" role="alert">${escapeHtml(message)}</div><button class="primary-button" type="submit">Create organization</button></form><button class="secondary-button" id="showLogin" type="button" style="width:100%;margin-top:10px">Back to sign in</button></section></div>`;
    const panel=$('authScreen').querySelector('.auth-panel');
    panel.setAttribute('role','dialog');
    panel.setAttribute('aria-modal','true');
    panel.setAttribute('aria-labelledby','authTitle');
    $('showLogin').addEventListener('click',()=>renderLogin());
    $('signupForm').addEventListener('submit',async event=>{
      event.preventDefault();
      const form=event.currentTarget,submit=form.querySelector('[type="submit"]');
      submit.disabled=true;
      $('authError').textContent='';
      try{
        const response=await fetch('/api/organizations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organizationName:$('signupOrganization').value,name:$('signupName').value,email:$('signupEmail').value,password:$('signupPassword').value})});
        const result=await response.json();
        if(!response.ok){$('authError').textContent=result.error||'Organization signup failed.';submit.disabled=false;return;}
        const statusResponse=await fetch('/api/status');
        if(!statusResponse.ok)throw new Error('Organization was created, but the login list could not be refreshed. Return to sign in and reload the page.');
        const status=await statusResponse.json();
        organizations=status.organizations||[];
        preferredOrganizationId=result.organization.id;
        preferredEmail=$('signupEmail').value.trim();
        renderLogin('Organization created. Sign in with your Administrator account.');
      }catch(error){$('authError').textContent=error.message||'Could not reach the sign-up service.';submit.disabled=false;}
    });
  }
  function enterApplication(user){
    loadWorkspaceData(user.organizationId);
    remoteWorkspaceLoaded=user.organizationId==='legacy';
    availableRoles=organizations.find(item=>item.id===user.organizationId)?.roles||[user.role];
    organizationUsers=[];
    organizationUsersLoaded=false;
    organizationUsersLoading=false;
    applyLoggedUser(user);
    serverAuthEvents=[];
    authAuditLoaded=false;
    document.body.classList.remove('signed-out');
    active='Overview';
    $('crumbName').textContent=active;
    $('authScreen').innerHTML='';
    setNav();
    render();
    refreshGmailStatus();
    loadDayEndReports();
    syncInventory();
  }
  async function initializeApp(){
    $('todayDate').textContent=shortDate();
    if(location.protocol==='file:'){renderLogin();return;}
    try{
      const statusResponse=await fetch('/api/status');
      const status=await statusResponse.json();
      organizations=status.organizations||[];
      preferredOrganizationId=organizations[0]?.id||'';
      const sessionResponse=await fetch('/api/session');
      const session=await sessionResponse.json();
      if(session.authenticated&&session.user)enterApplication(session.user);
      else renderLogin(status.loginConfigured?'':'No login roles are configured on this server.');
    }catch{renderLogin('Could not reach the sign-in service.');}
  }
  async function logoutUser(){
    try{await fetch('/api/logout',{method:'POST'});}catch{}
    renderLogin('You have signed out.');
  }
  $('mobileMenu').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
  $('alertsButton').addEventListener('click',()=>navigate('Notifications'));
  $('quickAction').addEventListener('click',()=>openModal(({ 'Overview':'sale','Products':'product','Stock In':'stockin','Stock Out':'stockout','Sales':'sale','Refunds':'refund'}[active])||'sale'));
  $('logoutButton').addEventListener('click',logoutUser);
  $('headerSignOut').addEventListener('click',logoutUser);
  window.addEventListener('resize',()=>{if($('salesChart'))chart();});
  initializeApp();
  setInterval(()=>{if(!currentUser)return;const changed=refreshExpiryAlerts();if(changed&&active==='Notifications')render();},60*60*1000);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  document.addEventListener('click',event=>{
    const expiryButton=event.target.closest('[data-set-expiry]');
    if(expiryButton)openExpiryDateModal(expiryButton.dataset.setExpiry);
  });
  document.addEventListener('click',event=>{
    const signatureButton=event.target.closest('[data-owner-signature]');
    if(signatureButton){openOwnerSignatureModal();return;}
    const copyButton=event.target.closest('[data-bill-copy]');
    if(copyButton)printVendorBill(copyButton.dataset.billCopy);
  });
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-mark-bill-paid]');
    if(!button)return;
    const bill=bills.find(item=>item.id===button.dataset.markBillPaid);
    if(!bill||bill.status==='Paid')return;
    bill.status='Paid';
    bill.paidDate=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    logAudit('Vendor bill paid',`${bill.invoice} · ${bill.vendor} · ${money(bill.amount)}`);
    save();
    render();
    showToast(`Bill ${bill.invoice} marked paid.`);
  });
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-action="notify"]');
    if(button){event.preventDefault();event.stopImmediatePropagation();showEmailChoices();}
  },true);
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-day-report]');
    if(!button)return;
    const record=dayEndReports.find(item=>item.date===button.dataset.dayReport);
    const report=record?.reports.find(item=>item.type===button.dataset.reportType);
    if(report)downloadDayEndReport(report);
  });
})();
</script>
